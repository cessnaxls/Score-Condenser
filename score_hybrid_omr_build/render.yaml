services:
  - type: web
    name: score-condensor
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_OMR_MODEL
        value: gpt-4.1
      - key: OPENAI_API_KEY
        sync: false
