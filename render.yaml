services:
  - type: web
    name: score-condensor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0

      - key: OPENAI_API_KEY
        sync: false
      - key: OMR_MODEL
        value: gpt-5.6-terra
